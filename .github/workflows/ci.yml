name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: examples/paper-agent/go.sum
      - run: go test ./examples/paper-agent/...
      - shell: bash
        run: |
          mkdir -p dist/bin
          suffix=""; [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          go build -o "dist/bin/paper-agent${suffix}" ./examples/paper-agent/cmd/paper-agent
          go build -o "dist/bin/paper-agent-server${suffix}" ./examples/paper-agent/cmd/paper-agent-server
          go build -o "dist/bin/feishu-adapter${suffix}" ./examples/paper-agent/cmd/feishu-adapter

  open-source-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: examples/paper-agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix ai-agent-roadmap-site ci
      - run: make open-source-check
      - run: npx playwright install --with-deps chromium
      - run: make browser-regression
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-regression
          path: artifacts/browser
