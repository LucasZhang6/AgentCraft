name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: examples/paper-agent/go.sum
      - shell: bash
        run: |
          mkdir -p dist/bin
          suffix=""; [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          go build -trimpath -ldflags="-s -w" -o "dist/bin/paper-agent${suffix}" ./examples/paper-agent/cmd/paper-agent
          go build -trimpath -ldflags="-s -w" -o "dist/bin/paper-agent-server${suffix}" ./examples/paper-agent/cmd/paper-agent-server
          go build -trimpath -ldflags="-s -w" -o "dist/bin/feishu-adapter${suffix}" ./examples/paper-agent/cmd/feishu-adapter
          VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: sigstore/cosign-installer@v3
      - name: Sign archives
        run: |
          for archive in release/*.tar.gz release/*.zip; do
            [[ -f "$archive" ]] || continue
            cosign sign-blob --yes --output-signature "$archive.sig" --output-certificate "$archive.pem" "$archive"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
