name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: examples/paper-agent/go.sum
      - shell: bash
        run: |
          mkdir -p dist/bin
          suffix=""; [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          go build -trimpath -ldflags="-s -w" -o "dist/bin/paper-agent${suffix}" ./examples/paper-agent/cmd/paper-agent
          go build -trimpath -ldflags="-s -w" -o "dist/bin/paper-agent-server${suffix}" ./examples/paper-agent/cmd/paper-agent-server
          go build -trimpath -ldflags="-s -w" -o "dist/bin/feishu-adapter${suffix}" ./examples/paper-agent/cmd/feishu-adapter
          VERSION="${GITHUB_REF_NAME#v}" bash scripts/package-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Generate SPDX SBOM
        run: |
          mkdir -p dist/release
          trivy fs --include-dev-deps --format spdx-json --output dist/release/agentcraft.spdx.json .
          cd dist/release
          sha256sum agentcraft.spdx.json > agentcraft.spdx.json.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: |
            dist/release/agentcraft.spdx.json
            dist/release/agentcraft.spdx.json.sha256

  publish:
    needs: [package, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign archives
        run: |
          for artifact in release/*.tar.gz release/*.zip release/*.spdx.json; do
            [[ -f "$artifact" ]] || continue
            cosign sign-blob --yes --output-signature "$artifact.sig" --output-certificate "$artifact.pem" "$artifact"
          done
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
