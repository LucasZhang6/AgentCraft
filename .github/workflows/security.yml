name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27.0'
          cache-dependency-path: examples/your-agent/go.sum
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go for CodeQL
        if: matrix.language == 'go'
        working-directory: examples/your-agent
        run: go build ./...
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}

  supply-chain:
    name: Dependencies, vulnerabilities, and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: examples/your-agent/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix ai-agent-roadmap-site ci
      - name: Audit Go call paths
        working-directory: examples/your-agent
        run: |
          mkdir -p ../../artifacts/security
          set +e
          (
            set -e
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
            govulncheck ./...
          ) 2>&1 | tee ../../artifacts/security/govulncheck.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 100 ../../artifacts/security/govulncheck.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=govulncheck failed::${message}"
          fi
          exit "$status"
      - name: Audit JavaScript dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix ai-agent-roadmap-site audit --audit-level=high
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Download a fresh complete vulnerability database
        run: |
          trivy clean --all
          trivy image --download-db-only
      - name: Scan repository with the complete database
        run: |
          mkdir -p artifacts/security
          trivy fs --include-dev-deps --scanners vuln,secret,misconfig --format sarif --output artifacts/security/trivy.sarif .
          trivy fs --include-dev-deps --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Generate SPDX SBOM
        run: trivy fs --include-dev-deps --format spdx-json --output artifacts/security/agentcraft.spdx.json .
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always() && hashFiles('artifacts/security/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: artifacts/security/trivy.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('artifacts/security/**') != ''
        with:
          name: security-reports
          path: artifacts/security
          if-no-files-found: error
