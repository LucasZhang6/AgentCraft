version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /examples/paper-agent
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-npm:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ai-agent-roadmap-site
    schedule:
      interval: weekly
    groups:
      roadmap-npm:
        patterns: ['*']
