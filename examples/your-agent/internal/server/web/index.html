<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Agent</title>
  <style>
    :root{color-scheme:light;--ink:#17202c;--muted:#687384;--line:#d7dde5;--paper:#fff;--wash:#f3f5f7;--nav:#202832;--blue:#1769aa;--green:#18794e;--red:#b4232d;--terminal:#111820}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #b8c2ce;background:#fff;border-radius:5px;padding:7px 10px}button:hover{background:#f6f8fa}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:#12598f}.danger{color:var(--red)}.icon{width:34px;height:34px;padding:0;font-size:18px}.muted{color:var(--muted)}
    .app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr)}header{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--nav);color:#fff;border-bottom:1px solid #10161d}.brand{font-size:17px;font-weight:760}.runtime{font-size:12px;color:#bec8d4}.connection{margin-left:auto;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#8e98a6}.dot.live{background:#43c484}.mobile-nav{display:none;gap:2px}header button{border-color:#465260;background:transparent;color:#dce4ed;padding:5px 8px}
    .workspace{min-height:0;display:grid;grid-template-columns:248px minmax(420px,1fr) 410px}.sidebar,.workbench{min-height:0;overflow:auto;background:#eef1f4}.sidebar{border-right:1px solid var(--line)}.workbench{border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr)}.section{padding:16px;border-bottom:1px solid var(--line)}h2{margin:0 0 9px;font-size:11px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}.meta{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);word-break:break-word;white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.login input,.search{width:100%;border:1px solid #b8c2ce;border-radius:5px;background:#fff;padding:8px}.login button{width:100%;margin-top:7px}
    .session-list,.resource-list{display:grid}.session-item,.resource-item{width:100%;border:0;border-bottom:1px solid #dde2e8;border-radius:0;background:transparent;text-align:left;padding:9px 4px}.session-item.active{color:var(--blue);font-weight:700}.session-title,.resource-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session-meta,.resource-meta{display:block;color:var(--muted);font-size:11px;font-weight:400}.empty-small{padding:18px 2px;color:var(--muted);font-size:12px}
    main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--paper)}#messages{min-height:0;overflow:auto;padding:24px max(20px,calc((100% - 820px)/2)) 48px}.empty{color:var(--muted);padding:18vh 0;text-align:center;font-size:16px}.message{padding:17px 0;border-bottom:1px solid #e7ebef}.role{margin-bottom:7px;font-size:12px;font-weight:750;color:var(--green)}.assistant .role{color:var(--blue)}.content{font-size:15px;word-break:break-word}.content pre{overflow:auto;padding:13px;border-radius:5px;background:var(--terminal);color:#e9eef4;white-space:pre-wrap}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.content h2{margin:20px 0 8px;color:var(--ink);font-size:19px;text-transform:none}.content h3{margin:16px 0 6px}.content a{color:var(--blue)}.composer{padding:11px max(18px,calc((100% - 820px)/2));border-top:1px solid var(--line);background:#fafbfc}.mode,.tabs{display:flex;gap:2px}.mode{margin-bottom:7px}.mode button,.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 9px}.mode button.active,.tabs button.active{background:#dfeaf4;color:var(--blue)}.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:end}.entry textarea{min-height:44px;max-height:150px;resize:none;border:1px solid #aeb9c6;border-radius:6px;padding:10px;background:#fff}.file-count{min-height:18px;margin-top:4px;color:var(--muted);font-size:11px}
    .tabs{padding:9px 10px;border-bottom:1px solid var(--line);overflow:auto;background:#e9edf1}.panel{display:none;min-height:0;overflow:auto}.panel.active{display:block}.panel-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line);background:#f7f8fa}.panel-title{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.panel-head .actions{margin:0 0 0 auto}.panel-body{padding:10px 12px}.editor{display:grid;height:100%;grid-template-rows:auto minmax(180px,1fr)}#editor{width:100%;height:100%;min-height:340px;resize:none;border:0;outline:0;padding:14px;background:#fff;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}.terminal{display:grid;height:100%;grid-template-rows:minmax(260px,1fr) auto;background:var(--terminal)}#terminalOutput{min-height:340px;margin:0;padding:12px;overflow:auto;color:#d9e1e9;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}#terminalInput{width:100%;border:0;border-top:1px solid #34404d;outline:0;padding:10px;background:#17212b;color:#f1f5f8;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.record{padding:10px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record-head{display:flex;gap:8px;align-items:center}.badge{margin-left:auto;font-size:11px;color:var(--muted)}.record p{margin:5px 0 0;color:var(--muted);font-size:12px;white-space:pre-wrap}.skill-content{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.plan-step{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.plan-step b{display:block}.plan-step span{color:var(--muted)}
    .panel.editor,.panel.terminal{display:none}.panel.editor.active,.panel.terminal.active{display:grid}
    dialog{max-width:520px;border:1px solid var(--line);border-radius:6px;padding:20px;color:var(--ink)}dialog::backdrop{background:rgba(12,18,27,.42)}dialog h3{margin-top:0}.approval-params{max-height:180px;overflow:auto;padding:10px;background:var(--wash);white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
    @media(max-width:1180px){.workspace{grid-template-columns:220px minmax(390px,1fr) 340px}}
    @media(max-width:850px){header{padding:0 10px}.runtime{display:none}.mobile-nav{display:flex}.workspace{display:block}.sidebar,main,.workbench{display:none;height:calc(100vh - 52px)}.workspace[data-mobile="sessions"] .sidebar{display:block}.workspace[data-mobile="chat"] main{display:grid}.workspace[data-mobile="tools"] .workbench{display:grid}.sidebar,.workbench{border:0}#messages{padding:18px 15px 38px}.composer{padding:9px 11px}.entry{grid-template-columns:minmax(0,1fr) auto}.attach{display:none}.workbench{grid-template-rows:auto minmax(0,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">Your Agent</div><div class="runtime">durable agent runtime</div><div class="mobile-nav"><button data-mobile="sessions">Sessions</button><button data-mobile="chat">Chat</button><button data-mobile="tools">Tools</button></div><div class="connection"><span id="statusText">disconnected</span><span id="statusDot" class="dot"></span></div></header>
  <div id="workspace" class="workspace" data-mobile="chat">
    <aside class="sidebar">
      <div class="section login"><h2>Connection</h2><input id="access" type="password" placeholder="Access ID (optional)"><button id="connect">Connect</button></div>
      <div class="section"><h2>Session</h2><div id="session" class="meta"></div><div class="actions"><button id="newSession">New</button><button id="forkSession">Fork</button><button id="renameSession">Rename</button><button id="cancel" class="danger" disabled>Cancel</button></div></div>
      <div class="section"><h2>History</h2><input id="sessionSearch" class="search" placeholder="Search sessions"><div id="sessionList" class="session-list"></div></div>
      <div class="section"><h2>Goal</h2><div id="goalState" class="meta">No persisted goal</div><div class="actions"><button data-goal="pause">Pause</button><button data-goal="resume">Resume</button><button data-goal="clear">Clear</button></div></div>
    </aside>
    <main>
      <div id="messages"><div class="empty">Start with a question, task, or persistent Goal.</div></div>
      <div class="composer"><div class="mode"><button data-mode="chat" class="active">Chat</button><button data-mode="goal">Goal</button></div><div class="entry"><textarea id="input" rows="1" placeholder="Ask Your Agent"></textarea><button id="attach" class="icon attach" title="Attach images">+</button><button id="send" class="primary">Send</button></div><input id="files" type="file" accept="image/*" multiple hidden><div id="fileCount" class="file-count"></div></div>
    </main>
    <section class="workbench">
      <div class="tabs"><button data-panel="filesPanel" class="active">Files</button><button data-panel="terminalPanel">Terminal</button><button data-panel="tasksPanel">Tasks</button><button data-panel="agentsPanel">Agents</button><button data-panel="skillsPanel">Skills</button><button data-panel="planPanel">Plan</button></div>
      <div id="filesPanel" class="panel active"><div class="panel-head"><button id="fileUp" class="icon" title="Parent directory">↑</button><div id="filePath" class="panel-title">.</div><div class="actions"><button id="fileRefresh" class="icon" title="Refresh">↻</button></div></div><div id="fileList" class="panel-body resource-list"></div></div>
      <div id="editorPanel" class="panel editor"><div class="panel-head"><button id="editorBack" class="icon" title="Back to files">←</button><div id="editorPath" class="panel-title"></div><div class="actions"><button id="downloadFile">Download</button><button id="saveFile" class="primary">Save</button></div></div><textarea id="editor" spellcheck="false"></textarea></div>
      <div id="terminalPanel" class="panel terminal"><pre id="terminalOutput"></pre><input id="terminalInput" autocomplete="off" spellcheck="false" placeholder="$"></div>
      <div id="tasksPanel" class="panel"><div class="panel-head"><div class="panel-title">Tasks</div><div class="actions"><button id="taskRefresh" class="icon" title="Refresh">↻</button></div></div><div id="taskList" class="panel-body"></div></div>
      <div id="agentsPanel" class="panel"><div class="panel-head"><div class="panel-title">Subagents</div><div class="actions"><button id="agentRefresh" class="icon" title="Refresh">↻</button></div></div><div id="agentList" class="panel-body"></div></div>
      <div id="skillsPanel" class="panel"><div class="panel-head"><div class="panel-title">Skills</div><div class="actions"><button id="skillRefresh" class="icon" title="Refresh">↻</button></div></div><div id="skillList" class="panel-body"></div></div>
      <div id="planPanel" class="panel"><div class="panel-head"><div class="panel-title">Latest Plan</div></div><div id="plan" class="panel-body meta">No plan yet</div></div>
    </section>
  </div>
</div>
<dialog id="approval"><h3>Tool approval required</h3><div id="approvalName"></div><pre id="approvalParams" class="approval-params"></pre><div class="actions"><button id="deny" class="danger">Deny</button><button id="allow">Allow once</button><button id="allowAll" class="primary">Allow remaining</button></div></dialog>
<script>
const state={token:"",session:localStorage.getItem("your-agent-session")||"",task:"",mode:"chat",images:[],assistant:null,lastApproval:"",filePath:".",editorPath:"",terminal:null};
const $=id=>document.getElementById(id);const q=value=>encodeURIComponent(value);$("session").textContent=state.session||"Not selected";
function headers(json=true){const value={};if(json)value["Content-Type"]="application/json";if(state.token)value.Authorization="Bearer "+state.token;return value}
async function api(path,options={}){options.headers={...headers(options.body!==undefined),...(options.headers||{})};const response=await fetch(path,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function connected(value,text){$("statusDot").classList.toggle("live",value);$("statusText").textContent=text}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function markdown(value){let safe=escapeHTML(value);safe=safe.replace(/```([\w-]*)\n([\s\S]*?)```/g,"<pre><code>$2</code></pre>");safe=safe.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>");safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');return safe.replace(/\n/g,"<br>")}
function clearEmpty(){const empty=$("messages").querySelector(".empty");if(empty)empty.remove()}
function addMessage(role,content=""){clearEmpty();const item=document.createElement("div");item.className=`message ${role}`;item.innerHTML=`<div class="role">${role==="user"?"You":"Agent"}</div><div class="content"></div>`;$("messages").appendChild(item);const target=item.querySelector(".content");target.dataset.raw=content;target.innerHTML=markdown(content);$("messages").scrollTop=$("messages").scrollHeight;return target}
function appendDelta(delta){if(!state.assistant)state.assistant=addMessage("assistant");state.assistant.dataset.raw=(state.assistant.dataset.raw||"")+delta;state.assistant.textContent=state.assistant.dataset.raw;$("messages").scrollTop=$("messages").scrollHeight}
function finalize(content){if(!state.assistant)state.assistant=addMessage("assistant",content);else{state.assistant.dataset.raw=content;state.assistant.innerHTML=markdown(content)}state.assistant=null}
async function connect(){try{const data=await api("/api/auth/login",{method:"POST",body:JSON.stringify({access_id:$("access").value})});state.token=data.token;connected(true,"ready");const ensured=await api("/api/sessions",{method:"POST",body:JSON.stringify({session_id:state.session})});selectSession(ensured.sessionId,false);await loadSession();await refreshAll()}catch(error){connected(false,error.message)}}
async function createSession(){const created=await api("/api/sessions",{method:"POST",body:"{}"});selectSession(created.sessionId,false);await refreshSessions()}
function selectSession(id,load=true){state.session=id;localStorage.setItem("your-agent-session",id);$("session").textContent=id;document.querySelectorAll(".session-item").forEach(item=>item.classList.toggle("active",item.dataset.id===id));if(load)loadSession()}
async function loadSession(){const data=await api(`/api/sessions/messages?session_id=${q(state.session)}`);$("messages").innerHTML="";for(const item of data.messages||[])addMessage(item.role,item.content||"");if(!(data.messages||[]).length)$("messages").innerHTML='<div class="empty">Session ready.</div>';refreshContext()}
async function refreshSessions(){const data=await api(`/api/sessions?q=${q($("sessionSearch").value)}&limit=100`);$("sessionList").innerHTML=(data.sessions||[]).map(item=>`<button class="session-item ${item.sessionId===state.session?"active":""}" data-id="${escapeHTML(item.sessionId)}"><span class="session-title">${escapeHTML(item.title||"Untitled session")}</span><span class="session-meta">${item.messageCount} messages · ${escapeHTML(item.lastTurnStatus||"idle")}</span></button>`).join("")||'<div class="empty-small">No sessions</div>';document.querySelectorAll(".session-item").forEach(item=>item.onclick=()=>selectSession(item.dataset.id))}
async function send(){const text=$("input").value.trim();if(!text&&!state.images.length)return;addMessage("user",text||"[images]");$("input").value="";$("send").disabled=true;state.assistant=null;connected(true,"starting");try{const task=await api("/api/agent/execute",{method:"POST",body:JSON.stringify({message:text,images:state.images,mode:state.mode,async:true,session_id:state.session})});state.task=task.task_id;selectSession(task.session_id,false);$("cancel").disabled=false;state.images=[];$("fileCount").textContent="";await stream(task.task_id)}catch(error){addMessage("assistant","Error: "+error.message);connected(false,"failed")}finally{$("send").disabled=false;$("cancel").disabled=true;refreshAll()}}
async function stream(taskID){let after=0,finished=false,retries=0;while(!finished){try{const response=await fetch(`/api/agent/events?task_id=${q(taskID)}&after=${after}`,{headers:headers(false)});if(!response.ok)throw new Error(`stream HTTP ${response.status}`);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let boundary;while((boundary=buffer.indexOf("\n\n"))>=0){const block=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);const line=block.split("\n").find(value=>value.startsWith("data: "));if(!line)continue;const event=JSON.parse(line.slice(6));if(event.type==="message")after=Math.max(after,(event.index||0)+1);handleEvent(event);if(event.type==="status"&&event.status.complete)finished=true}}if(!finished)throw new Error("stream disconnected before completion");retries=0}catch(error){const status=await api(`/api/agent/status?task_id=${q(taskID)}`).catch(()=>null);if(status?.complete){handleEvent({type:"status",status});finished=true;break}retries++;connected(true,`reconnecting stream (${retries})`);await new Promise(resolve=>setTimeout(resolve,Math.min(1000*retries,5000)))}}}
function handleEvent(event){if(event.type==="message"){const message=event.message;if(message.startsWith("assistant_delta:"))appendDelta(message.slice(16));else connected(true,message.replaceAll("_"," "))}else if(event.type==="status"){const status=event.status;connected(!status.complete,status.status);if(status.pending_approval)showApproval(status.pending_approval);if(status.complete){if(status.success)finalize(status.result);else if(status.error)addMessage("assistant","Error: "+status.error)}}}
function showApproval(item){if(state.lastApproval===item.tool_id)return;state.lastApproval=item.tool_id;$("approvalName").textContent=`${item.tool_name} (${item.agent_name})`;$("approvalParams").textContent=item.params_preview;$("approval").showModal()}
async function decide(approved,all=false){await api("/api/agent/approve",{method:"POST",body:JSON.stringify({task_id:state.task,tool_id:state.lastApproval,approved,approve_all:all})});$("approval").close();state.lastApproval=""}
async function goalAction(action){try{await api("/api/goal/action",{method:"POST",body:JSON.stringify({session_id:state.session,action,auto_resume:action==="resume"})});refreshContext()}catch(error){$("goalState").textContent=error.message}}
async function refreshContext(){api(`/api/goal/status?session_id=${q(state.session)}`).then(goal=>{$("goalState").textContent=`${goal.state} | ${goal.iterations} turns\n${goal.objective}`}).catch(()=>{$("goalState").textContent="No persisted goal"});api(`/api/plan/latest?session_id=${q(state.session)}`).then(plan=>{$("plan").innerHTML=plan.steps.map(step=>`<div class="plan-step"><b>${escapeHTML(step.id)} · ${escapeHTML(step.status)}</b><span>${escapeHTML(step.description)}</span></div>`).join("")}).catch(()=>{$("plan").textContent="No plan yet"})}
async function refreshFiles(){try{const data=await api(`/api/files?path=${q(state.filePath)}`);state.filePath=data.path;$("filePath").textContent=data.path;$("fileList").innerHTML=(data.entries||[]).map(item=>`<button class="resource-item" data-path="${escapeHTML(item.path)}" data-dir="${item.directory}"><span class="resource-name">${item.directory?"▸ ":""}${escapeHTML(item.name)}</span><span class="resource-meta">${item.directory?"directory":`${item.size} bytes`}</span></button>`).join("")||'<div class="empty-small">Empty directory</div>';document.querySelectorAll("#fileList .resource-item").forEach(item=>item.onclick=()=>item.dataset.dir==="true"?(state.filePath=item.dataset.path,refreshFiles()):openFile(item.dataset.path))}catch(error){$("fileList").innerHTML=`<div class="empty-small">${escapeHTML(error.message)}</div>`}}
async function openFile(path){try{const data=await api(`/api/files/content?path=${q(path)}`);state.editorPath=data.path;$("editorPath").textContent=data.path;$("editor").value=data.content;showPanel("editorPanel")}catch(error){alert(error.message)}}
async function saveFile(){await api("/api/files/content",{method:"PUT",body:JSON.stringify({path:state.editorPath,content:$("editor").value})});$("editorPath").textContent=state.editorPath+" · saved"}
function parentPath(path){if(!path||path===".")return ".";const parts=path.split("/");parts.pop();return parts.join("/")||"."}
async function refreshTasks(){const data=await api("/api/tasks?limit=100");$("taskList").innerHTML=(data.tasks||[]).map(item=>`<div class="record"><div class="record-head"><b>${escapeHTML(item.user_message||item.task_id)}</b><span class="badge">${escapeHTML(item.status)}</span></div><p>${escapeHTML(item.error||item.result||item.task_id)}</p></div>`).join("")||'<div class="empty-small">No tasks</div>'}
async function refreshAgents(){const data=await api(`/api/subagents?session_id=${q(state.session)}&limit=100`);$("agentList").innerHTML=(data.subagents||[]).map(item=>`<div class="record"><div class="record-head"><b>${escapeHTML(item.label||item.id)}</b><span class="badge">${escapeHTML(item.status)}</span></div><p>${escapeHTML(item.task)}${item.error?"\n"+escapeHTML(item.error):""}</p>${!item.finished_at?`<div class="actions"><button data-cancel-agent="${escapeHTML(item.id)}" class="danger">Cancel</button></div>`:""}</div>`).join("")||'<div class="empty-small">No subagents</div>';document.querySelectorAll("[data-cancel-agent]").forEach(button=>button.onclick=async()=>{await api("/api/subagents",{method:"POST",body:JSON.stringify({action:"cancel",id:button.dataset.cancelAgent})});refreshAgents()})}
async function refreshSkills(){const data=await api("/api/skills");$("skillList").innerHTML=(data.skills||[]).map(item=>`<button class="resource-item" data-skill="${escapeHTML(item.name)}"><span class="resource-name">${escapeHTML(item.name)}</span><span class="resource-meta">${escapeHTML(item.description)}</span></button>`).join("")||'<div class="empty-small">No skills</div>';document.querySelectorAll("[data-skill]").forEach(button=>button.onclick=async()=>{const item=await api(`/api/skills?name=${q(button.dataset.skill)}`);$("skillList").innerHTML=`<button id="skillBack">← Skills</button><h3>${escapeHTML(item.name)}</h3><div class="skill-content">${escapeHTML(item.content)}</div>`;$("skillBack").onclick=refreshSkills})}
function showPanel(id){document.querySelectorAll(".panel").forEach(panel=>panel.classList.toggle("active",panel.id===id));document.querySelectorAll("[data-panel]").forEach(button=>button.classList.toggle("active",button.dataset.panel===id));if(id==="terminalPanel")connectTerminal();if(id==="filesPanel")refreshFiles();if(id==="tasksPanel")refreshTasks();if(id==="agentsPanel")refreshAgents();if(id==="skillsPanel")refreshSkills();if(id==="planPanel")refreshContext()}
function connectTerminal(){if(state.terminal&&state.terminal.readyState<2)return;const protocol=location.protocol==="https:"?"wss":"ws";const token=state.token?`?token=${q(state.token)}`:"";const socket=new WebSocket(`${protocol}://${location.host}/api/terminal/ws${token}`);socket.binaryType="arraybuffer";state.terminal=socket;socket.onopen=()=>{socket.send(JSON.stringify({cols:100,rows:30}));$("terminalOutput").textContent+="[connected]\n"};socket.onmessage=async event=>{const text=typeof event.data==="string"?event.data:new TextDecoder().decode(event.data);$("terminalOutput").textContent+=text;$("terminalOutput").scrollTop=$("terminalOutput").scrollHeight};socket.onclose=()=>{$("terminalOutput").textContent+="\n[closed]\n"}}
async function refreshAll(){await Promise.allSettled([refreshSessions(),refreshContext(),refreshTasks(),refreshAgents(),refreshSkills(),refreshFiles()])}
$("connect").onclick=connect;$("send").onclick=send;$("input").onkeydown=event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();send()}};$("attach").onclick=()=>$("files").click();$("files").onchange=async event=>{state.images=await Promise.all([...event.target.files].slice(0,4).map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})));$("fileCount").textContent=`${state.images.length} image(s) attached`};
document.querySelectorAll("[data-mode]").forEach(button=>button.onclick=()=>{state.mode=button.dataset.mode;document.querySelectorAll("[data-mode]").forEach(item=>item.classList.toggle("active",item===button))});document.querySelectorAll("[data-goal]").forEach(button=>button.onclick=()=>goalAction(button.dataset.goal));document.querySelectorAll("[data-panel]").forEach(button=>button.onclick=()=>showPanel(button.dataset.panel));document.querySelectorAll("[data-mobile]").forEach(button=>button.onclick=()=>$("workspace").dataset.mobile=button.dataset.mobile);
$("newSession").onclick=async()=>{await createSession();$("messages").innerHTML='<div class="empty">New session ready.</div>'};$("forkSession").onclick=async()=>{const forked=await api("/api/sessions/fork",{method:"POST",body:JSON.stringify({session_id:state.session})});selectSession(forked.sessionId);refreshSessions()};$("renameSession").onclick=async()=>{const title=prompt("Session title");if(!title)return;await api("/api/sessions",{method:"PATCH",body:JSON.stringify({session_id:state.session,title})});refreshSessions()};$("sessionSearch").oninput=refreshSessions;$("cancel").onclick=()=>api(`/api/agent/cancel?task_id=${q(state.task)}`,{method:"POST"});$("deny").onclick=()=>decide(false);$("allow").onclick=()=>decide(true);$("allowAll").onclick=()=>decide(true,true);
$("fileRefresh").onclick=refreshFiles;$("fileUp").onclick=()=>{state.filePath=parentPath(state.filePath);refreshFiles()};$("editorBack").onclick=()=>showPanel("filesPanel");$("saveFile").onclick=saveFile;$("downloadFile").onclick=()=>location.href=`/api/files/download?path=${q(state.editorPath)}${state.token?`&token=${q(state.token)}`:""}`;$("taskRefresh").onclick=refreshTasks;$("agentRefresh").onclick=refreshAgents;$("skillRefresh").onclick=refreshSkills;$("terminalInput").onkeydown=event=>{if(event.key==="Enter"&&state.terminal?.readyState===1){state.terminal.send(event.target.value+"\n");event.target.value=""}};connect();
</script>
