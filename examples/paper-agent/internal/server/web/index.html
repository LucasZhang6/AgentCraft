<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paper Agent</title>
  <style>
    :root{color-scheme:light;--ink:#18212f;--muted:#687385;--line:#d8dee8;--paper:#fff;--wash:#f4f6f8;--blue:#1769aa;--green:#18794e;--amber:#9a6700;--red:#c52828}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
    .app{height:100vh;display:grid;grid-template-rows:52px minmax(0,1fr)}header{display:flex;align-items:center;gap:16px;padding:0 20px;background:#18212f;color:#fff;border-bottom:1px solid #0d131c}
    .brand{font-weight:750;font-size:17px}.runtime{color:#b9c5d5;font-size:12px}.status{margin-left:auto;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#8994a4}.dot.live{background:#45c486}
    .shell{min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}aside{min-height:0;overflow:auto;padding:18px 16px;background:#eef1f4;border-right:1px solid var(--line)}main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--paper)}
    h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;color:var(--muted)}.section{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.section:last-child{border:0}
    .meta{word-break:break-all;color:var(--muted);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    button{border:1px solid #b8c2cf;background:#fff;color:var(--ink);border-radius:5px;padding:7px 10px}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--red)}button.icon{width:34px;height:34px;padding:0;font-size:17px}
    .login input{width:100%;border:1px solid #b8c2cf;border-radius:5px;padding:8px;background:#fff}.login button{width:100%;margin-top:8px}
    #messages{min-height:0;overflow:auto;padding:28px max(24px,calc((100% - 900px)/2)) 60px}.message{padding:18px 0;border-bottom:1px solid #e7ebf0}.message:last-child{border:0}.role{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px}.assistant .role{color:var(--blue)}.content{font-size:15px;white-space:normal;word-break:break-word}.content pre{white-space:pre-wrap;background:#111923;color:#e7edf5;border-radius:5px;padding:14px;overflow:auto}.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.content h2{font-size:20px;text-transform:none;color:var(--ink);margin:22px 0 8px}.content h3{font-size:16px;margin:18px 0 6px}.content a{color:var(--blue)}
    .activity{margin:14px 0;color:var(--muted);font-size:12px}.composer{border-top:1px solid var(--line);padding:12px max(20px,calc((100% - 900px)/2));background:#f9fafb}.mode{display:flex;gap:2px;margin-bottom:8px}.mode button{border:0;background:transparent;padding:5px 9px;color:var(--muted)}.mode button.active{background:#e4edf7;color:var(--blue)}
    .entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}.entry textarea{resize:none;min-height:44px;max-height:160px;border:1px solid #aeb9c7;border-radius:6px;padding:11px;background:#fff;color:var(--ink)}.file-count{font-size:12px;color:var(--muted);margin-top:6px}
    dialog{border:1px solid var(--line);border-radius:6px;padding:20px;max-width:520px;color:var(--ink)}dialog::backdrop{background:rgba(12,18,27,.42)}dialog h3{margin-top:0}.approval-params{max-height:180px;overflow:auto;background:var(--wash);padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
    .plan-step{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.plan-step b{display:block;color:var(--ink)}.empty{color:var(--muted);padding:15vh 0;text-align:center;font-size:16px}
    @media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}header{padding:0 12px}.runtime{display:none}#messages{padding:18px 16px 40px}.composer{padding:10px 12px}.entry{grid-template-columns:minmax(0,1fr) auto}.entry .attach{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">Paper Agent</div><div class="runtime">durable agent runtime</div><div class="status"><span id="statusText">disconnected</span><span id="statusDot" class="dot"></span></div></header>
  <div class="shell">
    <aside>
      <div class="section login"><h2>Connection</h2><input id="access" type="password" placeholder="Access ID (optional)"><button id="connect">Connect</button></div>
      <div class="section"><h2>Session</h2><div id="session" class="meta"></div><div class="actions"><button id="newSession">New</button><button id="cancel" class="danger" disabled>Cancel</button></div></div>
      <div class="section"><h2>Goal</h2><div id="goalState" class="meta">No persisted goal</div><div class="actions"><button data-goal="pause">Pause</button><button data-goal="resume">Resume</button><button data-goal="clear">Clear</button></div></div>
      <div class="section"><h2>Latest Plan</h2><div id="plan" class="meta">No plan yet</div></div>
    </aside>
    <main>
      <div id="messages"><div class="empty">Start with a question, task, or persistent Goal.</div></div>
      <div class="composer">
        <div class="mode"><button data-mode="chat" class="active">Chat</button><button data-mode="goal">Goal</button></div>
        <div class="entry"><textarea id="input" rows="1" placeholder="Ask Paper Agent"></textarea><button id="attach" class="icon attach" title="Attach images">+</button><button id="send" class="primary">Send</button></div>
        <input id="files" type="file" accept="image/*" multiple hidden><div id="fileCount" class="file-count"></div>
      </div>
    </main>
  </div>
</div>
<dialog id="approval"><h3>Tool approval required</h3><div id="approvalName"></div><pre id="approvalParams" class="approval-params"></pre><div class="actions"><button id="deny" class="danger">Deny</button><button id="allow">Allow once</button><button id="allowAll" class="primary">Allow remaining</button></div></dialog>
<script>
const state={token:"",session:localStorage.getItem("paper-agent-session")||crypto.randomUUID(),task:"",mode:"chat",images:[],assistant:null,lastApproval:""};
const $=id=>document.getElementById(id); $("session").textContent=state.session;
function headers(json=true){const h={};if(json)h["Content-Type"]="application/json";if(state.token)h.Authorization="Bearer "+state.token;return h}
async function api(path,options={}){options.headers={...headers(options.body!==undefined),...(options.headers||{})};const response=await fetch(path,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function connected(value,text){$("statusDot").classList.toggle("live",value);$("statusText").textContent=text}
function escapeHTML(value){return value.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function markdown(value){let safe=escapeHTML(value);safe=safe.replace(/```([\w-]*)\n([\s\S]*?)```/g,"<pre><code>$2</code></pre>");safe=safe.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>");safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');return safe.replace(/\n/g,"<br>")}
function clearEmpty(){const empty=$("messages").querySelector(".empty");if(empty)empty.remove()}
function addMessage(role,content=""){clearEmpty();const item=document.createElement("div");item.className=`message ${role}`;item.innerHTML=`<div class="role">${role==="user"?"You":"Agent"}</div><div class="content"></div>`;$("messages").appendChild(item);const target=item.querySelector(".content");target.dataset.raw=content;target.innerHTML=markdown(content);$("messages").scrollTop=$("messages").scrollHeight;return target}
function appendDelta(delta){if(!state.assistant)state.assistant=addMessage("assistant");state.assistant.dataset.raw=(state.assistant.dataset.raw||"")+delta;state.assistant.textContent=state.assistant.dataset.raw;$("messages").scrollTop=$("messages").scrollHeight}
function finalize(content){if(!state.assistant)state.assistant=addMessage("assistant",content);else{state.assistant.dataset.raw=content;state.assistant.innerHTML=markdown(content)}state.assistant=null}
async function connect(){try{const data=await api("/api/auth/login",{method:"POST",body:JSON.stringify({access_id:$("access").value})});state.token=data.token;connected(true,"ready");refreshSidebar()}catch(error){connected(false,error.message)}}
async function send(){const text=$("input").value.trim();if(!text&&!state.images.length)return;addMessage("user",text||"[images]");$("input").value="";$("send").disabled=true;state.assistant=null;connected(true,"starting");try{const task=await api("/api/agent/execute",{method:"POST",body:JSON.stringify({message:text,images:state.images,mode:state.mode,async:true,session_id:state.session})});state.task=task.task_id;state.session=task.session_id;localStorage.setItem("paper-agent-session",state.session);$("session").textContent=state.session;$("cancel").disabled=false;state.images=[];$("fileCount").textContent="";await stream(task.task_id)}catch(error){addMessage("assistant","Error: "+error.message);connected(false,"failed")}finally{$("send").disabled=false;$("cancel").disabled=true;refreshSidebar()}}
async function stream(taskID){const response=await fetch(`/api/agent/events?task_id=${encodeURIComponent(taskID)}`,{headers:headers(false)});if(!response.ok)throw new Error(`stream HTTP ${response.status}`);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let boundary;while((boundary=buffer.indexOf("\n\n"))>=0){const block=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);const line=block.split("\n").find(v=>v.startsWith("data: "));if(!line)continue;handleEvent(JSON.parse(line.slice(6)))}}}
function handleEvent(event){if(event.type==="message"){const message=event.message;if(message.startsWith("assistant_delta:"))appendDelta(message.slice(16));else connected(true,message.replaceAll("_"," "))}else if(event.type==="status"){const status=event.status;connected(!status.complete,status.status);if(status.pending_approval)showApproval(status.pending_approval);if(status.complete){if(status.success)finalize(status.result);else if(status.error)addMessage("assistant","Error: "+status.error)}}}
function showApproval(item){if(state.lastApproval===item.tool_id)return;state.lastApproval=item.tool_id;$("approvalName").textContent=`${item.tool_name} (${item.agent_name})`;$("approvalParams").textContent=item.params_preview;$("approval").showModal()}
async function decide(approved,all=false){const tool=state.lastApproval;await api("/api/agent/approve",{method:"POST",body:JSON.stringify({task_id:state.task,tool_id:tool,approved,approve_all:all})});$("approval").close();state.lastApproval=""}
async function goalAction(action){try{await api("/api/goal/action",{method:"POST",body:JSON.stringify({session_id:state.session,action,auto_resume:action==="resume"})});refreshSidebar()}catch(error){$("goalState").textContent=error.message}}
async function refreshSidebar(){api(`/api/goal/status?session_id=${encodeURIComponent(state.session)}`).then(goal=>{$("goalState").textContent=`${goal.state} | ${goal.iterations} turns\n${goal.objective}`}).catch(()=>{$("goalState").textContent="No persisted goal"});api(`/api/plan/latest?session_id=${encodeURIComponent(state.session)}`).then(plan=>{$("plan").innerHTML=plan.steps.map(step=>`<div class="plan-step"><b>${escapeHTML(step.id)} · ${escapeHTML(step.status)}</b>${escapeHTML(step.description)}</div>`).join("")}).catch(()=>{$("plan").textContent="No plan yet"})}
$("connect").onclick=connect;$("send").onclick=send;$("input").onkeydown=event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();send()}};$("attach").onclick=()=>$("files").click();$("files").onchange=async event=>{state.images=await Promise.all([...event.target.files].slice(0,4).map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})));$("fileCount").textContent=`${state.images.length} image(s) attached`};
document.querySelectorAll("[data-mode]").forEach(button=>button.onclick=()=>{state.mode=button.dataset.mode;document.querySelectorAll("[data-mode]").forEach(item=>item.classList.toggle("active",item===button))});document.querySelectorAll("[data-goal]").forEach(button=>button.onclick=()=>goalAction(button.dataset.goal));
$("newSession").onclick=()=>{state.session=crypto.randomUUID();localStorage.setItem("paper-agent-session",state.session);$("session").textContent=state.session;$("messages").innerHTML='<div class="empty">New session ready.</div>';refreshSidebar()};$("cancel").onclick=()=>api(`/api/agent/cancel?task_id=${encodeURIComponent(state.task)}`,{method:"POST"});$("deny").onclick=()=>decide(false);$("allow").onclick=()=>decide(true);$("allowAll").onclick=()=>decide(true,true);connect();
</script>
</body>
</html>
